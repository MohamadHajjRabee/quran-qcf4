:root {
  --bg-app:     #0b121b;
  --bg-panel:   #111b27;
  --bg-tab:     #16212f;
  --bg-row-alt: #0e1720;
  --border:     #1e2c3d;
  --fg:         #e3eaf2;
  --fg-dim:     #8da1b9;
  --accent:     #6cb8e6;
  --accent-2:   #91d076;
  --num:        #e6d37a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg-app);
  color: var(--fg);
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
.page-header {
  padding: 22px 24px 14px;
}
.page-header h1 {
  margin: 0 0 6px;
  font-size: 18px;
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  font-weight: 600;
  color: var(--fg);
}
.page-header .meta {
  font-size: 12.5px;
  color: var(--fg-dim);
  line-height: 1.6;
  max-width: 900px;
}
.page-header .meta b { color: var(--accent); font-weight: 600; }

.boxes {
  display: flex;
  flex-direction: row-reverse;
  flex-wrap: wrap;
  gap: 22px;
  padding: 0 24px 40px;
}

/* ---------------- one faux editor window per set ---------------- */
.box {
  flex: 0 0 calc(50% - 11px);
  width: calc(50% - 11px);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 14px 30px -18px rgba(0,0,0,.7);
}
.box.box-full {
  flex: 0 0 100%;
  width: 100%;
}
.box .titlebar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg-tab);
  border-bottom: 1px solid var(--border);
}
.box .dots { display: flex; gap: 6px; flex: none; }
.box .dot { width: 11px; height: 11px; border-radius: 50%; }
.dot.red { background: #e0605a; }
.dot.yellow { background: #e6c15c; }
.dot.green { background: #61c46a; }
.box .filename {
  font-size: 12.5px; color: var(--fg);
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  margin-left: 4px;
}
.box .badge {
  font-size: 10.5px;
  color: var(--bg-app);
  background: var(--accent-2);
  border-radius: 999px;
  padding: 1px 8px;
  font-weight: 700;
  margin-left: 6px;
}
.box .desc {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--fg-dim);
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.box .body {
  background: var(--bg-panel);
}

table.glyph-table {
  width: 100%;
  border-collapse: collapse;
  font-family: Consolas, Monaco, "Andale Mono", monospace;
  font-size: 12.5px;
}
table.glyph-table thead th {
  background: var(--bg-tab);
  color: var(--fg-dim);
  text-align: left;
  font-weight: 600;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.glyph-table tbody td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  vertical-align: middle;
}
table.glyph-table tbody tr:nth-child(even) { background: var(--bg-row-alt); }
table.glyph-table tbody tr:hover { background: #16212f; }

td.c-idx  { color: var(--fg-dim); text-align: right; }
td.c-num  { color: var(--num); }
td.c-en   { color: var(--accent); }
td.c-ar   { color: var(--accent-2); direction: rtl; text-align: right; font-family: "QBSML", "Amiri Quran", serif; font-size: 15px; }
td.c-hex  { color: #f4adf4; }
td.c-tr   { color: #c699e3; }
td.c-glyph {
  direction: rtl;
  text-align: center;
  width: 1%;
}
.glyph {
  display: inline-block;
  height: 34px;
  overflow: hidden;
  font-family: "QBSML", serif;
  font-size: 24px;
  color: #e6d37a;
  line-height: 34px;
}

/* رموز البسملة تُرسم كـ SVG مستخرج من الخط: لا تتأثر بـ hinting ولا تُقصّ بـ overflow */
.glyph-svg {
  display: inline-block;
  height: auto;
  fill: #e6d37a;
  vertical-align: middle;
  overflow: visible;
  shape-rendering: geometricPrecision;
}

.loading, .error {
  padding: 40px; text-align: center; color: var(--fg-dim);
  font-family: Consolas, Monaco, monospace;
}
.error { color: #e0605a; }
</style>

const GLYPH_PX = 24; // نفس حجم .glyph الأصلي

function bsmlSvg(hex) {
  const g = BSML_SVG[String(hex).toUpperCase()];
  if (!g) return null;
  const w = (g.w / g.u * GLYPH_PX).toFixed(2);
  return `<svg class="glyph-svg" viewBox="0 0 ${g.w} ${g.h}" style="width:${w}px" role="img" aria-label="U+${hex}"><path d="${g.d}"/></svg>`;
}

const COLUMN_CONFIGS = {
  surah_headers_style_a:        surahColumns,
  surah_headers_style_b:        surahColumns,
  surah_headers_style_a_merged: mergedColumns,
  surah_headers_style_b_merged: mergedColumns,
  juz_headers_style_a:          juzColumns,
  juz_headers_style_b:          juzColumns,
  opening_matter_and_ornaments: miscColumns,
  full_bismillah_hafs01:        fullBismillahColumns,
};

function surahColumns() {
  return [
    { label: "#",              cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Sura",           cell: (e) => `<td class="c-num">${e.sura}</td>` },
    { label: "Name (EN)",      cell: (e) => `<td class="c-en">${e.name_en}</td>` },
    { label: "Name (Arabic)",  cell: (e) => `<td class="c-ar">${e.name_arabic}</td>` },
    { label: "Char",           cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",          cell: (e) => glyphCell(e) },
  ];
}

function mergedColumns() {
  return [
    { label: "#",              cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Suras",          cell: (e) => `<td class="c-num">${e.suras.join(", ")}</td>` },
    { label: "Names (EN)",     cell: (e) => `<td class="c-en">${e.names_en.map(n => `<span style="display:block">${n}</span>`).join("")}</td>` },
    { label: "Names (Arabic)", cell: (e) => `<td class="c-ar">${e.names_arabic.join(" \u00b7 ")}</td>` },
    { label: "Char",           cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",          cell: (e) => glyphCell(e) },
  ];
}

function juzColumns() {
  return [
    { label: "#",              cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Juz",            cell: (e) => `<td class="c-num">${e.juz}</td>` },
    { label: "Label",          cell: (e) => `<td class="c-en">Juz ${e.juz}</td>` },
    { label: "Name (Arabic)",  cell: (e) => `<td class="c-ar">${e.name_arabic_approx}</td>` },
    { label: "Char",           cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",          cell: (e) => glyphCell(e) },
  ];
}

function miscColumns() {
  return [
    { label: "#",               cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Group",           cell: (e) => `<td class="c-en">${e.group}</td>` },
    { label: "Transliteration", cell: (e) => `<td class="c-tr">${e.kind === "text" ? e.transliteration : "\u2014"}</td>` },
    { label: "Text (Arabic)",   cell: (e) => `<td class="c-ar">${e.kind === "text" ? e.text_arabic : "\u2014"}</td>` },
    { label: "Char",            cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",           cell: (e) => glyphCell(e) },
  ];
}

function fullBismillahColumns() {
  return [
    { label: "#",               cell: (e, i) => `<td class="c-idx">${i + 1}</td>` },
    { label: "Used by",         cell: (e) => `<td class="c-en">${e.used}</td>` },
    { label: "Font",            cell: (e) => `<td class="c-tr">${e.font}</td>` },
    { label: "Text (Arabic)",   cell: (e) => `<td class="c-ar">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</td>` },
    { label: "Char",            cell: (e) => `<td class="c-hex">U+${e.hex}</td>` },
    { label: "Glyph",           cell: (e) => glyphCell(e) },
  ];
}

function glyphCell(e) {
  // البسملة (أجزاء وكاملة): SVG بدل حرف الخط
  const svg = bsmlSvg(e.hex);
  if (svg) return `<td class="c-glyph">${svg}</td>`;
  const ch = String.fromCodePoint(e.codepoint);
  return `<td class="c-glyph"><span class="glyph">${ch}</span></td>`;
}

async function init() {
  const metaEl = document.getElementById('meta');
  const boxesEl = document.getElementById('boxes');

  let data;
  try {
    const res = await fetch('qbsml.json');
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    metaEl.textContent = '';
    boxesEl.innerHTML = '<div class="error">Could not load qbsml.json \u2014 serve this folder over HTTP '
      + '(e.g. python3 -m http.server) rather than opening the file directly.</div>';
    return;
  }

  metaEl.innerHTML =
    '<b>font</b> ' + data.font +
    ' &nbsp;\u00b7&nbsp; <b>total glyphs in font</b> ' + data.total_glyphs_in_font +
    ' &nbsp;\u00b7&nbsp; <b>non-empty glyphs investigated</b> ' + data.non_empty_glyphs_investigated +
    ' &nbsp;\u00b7&nbsp; <b>sets</b> ' + data.sets.length +
    '<br>' + data.description;

  const DISPLAY_ORDER = [
    "surah_headers_style_a",
    "surah_headers_style_b",
    "surah_headers_style_a_merged",
    "surah_headers_style_b_merged",
    "juz_headers_style_a",
    "juz_headers_style_b",
    "opening_matter_and_ornaments",
  ];
  const orderedSets = [...data.sets].sort(
    (a, b) => DISPLAY_ORDER.indexOf(a.name) - DISPLAY_ORDER.indexOf(b.name)
  );

  // جدول إضافي: البسملة الكاملة (من QCF4_Hafs_01) كما تستعملها صفحات المصحف
  orderedSets.push({
    name: "full_bismillah_hafs01",
    label: "Full Bismillah glyphs (QCF4_Hafs_01, drawn as SVG)",
    codepoint_range: "0xF8D6 \u00b7 0xF8D7 \u00b7 0xF8DD",
    count: 3,
    entries: [
      { hex: "F8D6", used: "109 surahs (all except 1, 2, 9, 95, 97)", font: "QCF4_Hafs_01" },
      { hex: "F8D7", used: "Surahs 95, 97",                          font: "QCF4_Hafs_01" },
      { hex: "F8DD", used: "Surah 2",                                font: "QCF4_Hafs_01" },
    ],
  });

  orderedSets.forEach((set) => {
    const box = document.createElement('div');
    box.className = 'box' + ((set.name === 'opening_matter_and_ornaments' || set.name === 'full_bismillah_hafs01') ? ' box-full' : '');

    const columns = (COLUMN_CONFIGS[set.name] || surahColumns)();

    const thead = columns.map(c => `<th>${c.label}</th>`).join('');
    const tbody = set.entries.map((e, i) =>
      `<tr>${columns.map(c => c.cell(e, i)).join('')}</tr>`
    ).join('');

    box.innerHTML =
      '<div class="titlebar">' +
        '<div class="dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>' +
        '<span class="filename">' + set.name + '.json</span>' +
        '<span class="badge">' + set.count + '</span>' +
        '<span class="desc">' + set.label + ' \u00b7 ' + set.codepoint_range + '</span>' +
      '</div>' +
      '<div class="body">' +
        '<table class="glyph-table">' +
          '<thead><tr>' + thead + '</tr></thead>' +
          '<tbody>' + tbody + '</tbody>' +
        '</table>' +
      '</div>';

    boxesEl.appendChild(box);
  });
}
init();
